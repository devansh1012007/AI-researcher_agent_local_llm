[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gar-research-engine"
version = "0.1.0"
description = "Grounded Agentic Researcher - local-first, evidence-first research engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "trafilatura>=1.8",
    "pypdf>=4.0",
    "rich>=13.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
]

[project.scripts]
research = "research_engine.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The prompt templates and built-in engine packs are DATA, not modules:
# neither directory has __init__.py, so setuptools would otherwise copy zero
# data files into the wheel.
# NOTE: the keys MUST stay quoted. An unquoted `research_engine.prompts = [...]`
# is a TOML *nested table* (`package-data -> research_engine -> prompts`),
# which setuptools does not understand. The quotes make it one literal key.
"research_engine.prompts" = ["templates/*/*.txt", "templates/*/*.meta.yaml"]
"research_engine.engines" = [
    "builtin/*/*.yaml",
    "builtin/*/*.json",
    "builtin/*/*.md",
    "builtin/*/skills/*.md",
    "builtin/*/prompts/*/*.txt",
    "builtin/*/prompts/*/*.meta.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
addopts = "-q"
