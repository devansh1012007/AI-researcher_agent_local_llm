schema_version: 1
name: generic
display_name: "General evidence-first research"
version: "1.0.0"
description: "Minimal general-purpose research engine pack for custom domain extension."
extends: null

clarifier:
  hint: "general evidence-first research"
  prompt_template: "problem_clarifier"
  required_inputs: []
  ask_user_when: []

planning:
  fallback_to_branches: true
  source_preferences:
    - web
    - openalex
  branches:
    - category: CURRENT_STATE
      default_question: "What is the current state of: {question}?"
      importance: 0.7
      required_evidence: "any credible supporting evidence"
      route: [web, documentation, openalex]
      fallback: true
    - category: EVIDENCE
      default_question: "What primary evidence supports or refutes claims about: {question}?"
      importance: 0.7
      required_evidence: "any credible supporting evidence"
      route: [web, openalex]
      fallback: true
    - category: LIMITATIONS
      default_question: "What limitations, counter-arguments, or failure cases exist for: {question}?"
      importance: 0.7
      required_evidence: "any credible supporting evidence"
      route: [web, forum]
      fallback: true
    - category: GENERIC
      default_question: "What additional context is relevant to: {question}?"
      importance: 0.6
      required_evidence: "any credible supporting evidence"
      route: [web, openalex]
      fallback: false

extraction:
  schema_hint: "claim; quote; confidence; entities; tags; kind; numbers"
  prompt_template: "evidence_extractor"
  domain_schema: "schema.json"
  require_verbatim_quote: true
  require_claim_support: true

analysis:
  structural_checks:
    - source_diversity
    - negative_evidence
    - independent_replication
    - causality
  specialist_pipeline: null

loop:
  setup:
    - step: clarify
      pause_after: false
      gate: AFTER_PROBLEM_DEFINITION
    - step: ask_user
      blocking: false
      max_questions: 3
    - step: plan
      pause_after: false
      gate: AFTER_INITIAL_RESEARCH_PLAN
    - step: generate_queries
  per_iteration:
    - step: search
      budget: max_queries_per_iteration
    - step: fetch_and_parse
      max_parallel: max_parallel_fetches
    - step: extract_evidence
    - step: verify_and_dedup
    - step: detect_contradictions
    - step: detect_gaps
    - step: evaluate_convergence
      pause_after: false
    - step: generate_followups
  stop_when:
    - metric: new_evidence_rate
      op: "<="
      value: 0.10
      after_iteration: 2
    - metric: duplicate_rate
      op: ">="
      value: 0.70
      after_iteration: 1
  synthesis:
    - step: write_reports

reports:
  core:
    - problem.md
    - research_plan.md
    - info.md
    - sources.md
    - gaps.md
    - research_log.md
  domain: []
  intelligence:
    - id: evidence_map
      file: evidence_map.md
    - id: contradiction_report
      file: contradiction_report.md
    - id: research_timeline
      file: research_timeline.md
  reasoning:
    - id: hypotheses
      file: hypotheses.md
    - id: assumptions
      file: assumptions.md
    - id: decision_analysis
      file: decision_analysis.md

tunables:
  max_iterations: 3
  max_queries_per_iteration: 8
  max_documents: 50
  max_sources_total: 150
  max_llm_calls: 300
  max_wall_clock_minutes: 60
  new_evidence_threshold: 0.10
  duplicate_rate_converged: 0.70
  results_per_query: 10
  max_chunk_chars: 6000
  chunk_overlap_chars: 400
  review_gates_enabled: false
  ask_user_enabled: false
  ask_user_blocking: false
  max_user_questions_per_run: 3

safety:
  allow_skip_quote_verification: false
  allow_skip_claim_support: false
  allow_network_in_local_only: false
  require_counterevidence_for_opportunities: true
